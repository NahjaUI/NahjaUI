<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NahjaUI</title>
  <!-- Two tones only: #8B7CFF and #5953A4 (the accent at 55% over the tile #1C2034). Symmetric shape, alternating colours. -->
  <rect width="128" height="128" rx="28" fill="#1C2034"/>
  <!-- top tiles -->
  <rect x="26" y="34" width="35" height="31" rx="7" fill="#8B7CFF"/>
  <rect x="67" y="34" width="35" height="31" rx="7" fill="#5953A4"/>
  <!-- bottom tiles -->
  <path d="M33 71 H61 V105 C44 105 26 92 26 78 C26 74 29 71 33 71 Z" fill="#5953A4"/>
  <path d="M95 71 H67 V105 C84 105 102 92 102 78 C102 74 99 71 95 71 Z" fill="#8B7CFF"/>
  <!-- ears: the opposite tone of the tile under each one -->
  <path d="M26 36 L31 13 L51 36 Z" fill="#5953A4"/>
  <path d="M102 36 L97 13 L77 36 Z" fill="#8B7CFF"/>
  <!-- inside of the ears: the opposite tone of their ear -->
  <path d="M32 33 L34 22 L43 33 Z" fill="#8B7CFF"/>
  <path d="M96 33 L94 22 L85 33 Z" fill="#5953A4"/>
</svg>
